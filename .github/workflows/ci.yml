name: CI

# 언제 실행할지 (develop 브랜치 건드리면 실행)
on:
  push:
    branches: [ "develop", "feature/**" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 1. 테스트를 위한 가상 DB 실행 (서비스 컨테이너)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: short_kki
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 2. 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 3. 자바 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 빌드 및 테스트 (여기가 핵심!)
      # application.yml의 빈 변수들을 여기서 채워줍니다.
      - name: Build with Gradle
        run: ./gradlew build
        env:
          # DB 연결 정보 (위의 services 설정과 맞춤)
          DB_USERNAME: root
          DB_PASSWORD: root
          TZ: Asia/Seoul

          # [중요] CI 단계에서는 "형식"만 맞으면 됩니다.
          # 실제 로그인을 할 게 아니므로 가짜(Dummy) 값을 넣어서
          # 스프링 부트가 켜질 때 에러만 안 나게 하면 됩니다.
          JWT_SECRET: "test-secret-key-must-be-very-very-long-for-security"

          GOOGLE_CLIENT_ID: "test-google-id"
          GOOGLE_CLIENT_SECRET: "test-google-secret"
          GOOGLE_REDIRECT_URI: "http://localhost:3000/login/oauth2/code/google"

          KAKAO_CLIENT_ID: "test-kakao-id"
          KAKAO_CLIENT_SECRET: "test-kakao-secret"
          KAKAO_REDIRECT_URI: "http://localhost:3000/login/oauth2/code/kakao"

          NAVER_CLIENT_ID: "test-naver-id"
          NAVER_CLIENT_SECRET: "test-naver-secret"
          NAVER_REDIRECT_URI: "http://localhost:3000/login/oauth2/code/naver"