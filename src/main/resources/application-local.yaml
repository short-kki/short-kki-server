spring:
  config:
    activate:
      on-profile: local
    import: classpath:application-secret.properties

  datasource:
    url: jdbc:mysql://localhost:3306/short_kki_tmp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: short_kki_admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
#        show_sql: true
#        format_sql: true
    defer-datasource-initialization: true

  elasticsearch:
    uris: http://localhost:9200

  sql:
    init:
      mode: always
#      mode: never

  flyway:
    enabled: false

jwt:
  secret: local__dev_only__short-kki__jwt-secret__32chars_min
  access-token-validity: 86400000
  refresh-token-validity: 604800000

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    filter: true

logging:
  level:
    #    org.hibernate.SQL: debug
    #    org.hibernate.orm.jdbc.bind: trace
    org.elasticsearch.client.RestClient: DEBUG

oauth2:
  provider:
    google-ios:
      client-id: ${GOOGLE_IOS_CLIENT_ID}
      redirect-uri: ${GOOGLE_IOS_REDIRECT_URI}
    google-android:
      client-id: ${GOOGLE_ANDROID_CLIENT_ID}
      redirect-uri: ${GOOGLE_ANDROID_REDIRECT_URI}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uri: ${NAVER_REDIRECT_URI}

aws:
  service:
    s3:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

google:
  credential:
    api-key: ${GOOGLE_GENAI_API_KEY:google-api-test-key}
  services:
    gemini:
      model-name: gemini-3-flash-preview

public-data:
  ingredient:
    enabled: true
    type: xml
    api-url: Grid_20150827000000000227_1
    url-template: "http://211.237.50.150:7080/openapi/%s/%s/%s/%d/%d"
    start-index: 1
    end-index: 1000
    api-key: ${INGREDIENT_API_KEY}
