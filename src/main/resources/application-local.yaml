spring:
  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/short_kki?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
#        show_sql: true
#        format_sql: true

  elasticsearch:
    uris: http://localhost:9200

jwt:
  secret: local__dev_only__short-kki__jwt-secret__32chars_min
  access-token-validity: 86400000
  refresh-token-validity: 604800000

logging:
  level:
    #    org.hibernate.SQL: debug
    #    org.hibernate.orm.jdbc.bind: trace
    org.elasticsearch.client.RestClient: DEBUG

oauth2:
  provider:
    google-web:
      client-id: local-google-client-id

aws:
  service:
    s3:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

google:
  credential:
    api-key: ${GOOGLE_GENAI_API_KEY:google-api-test-key}
  services:
    gemini:
      model-name: gemini-3-flash-preview

public-data:
  ingredient:
    enabled: false
    type: xml
    api-url: Grid_20150827000000000227_1
    url-template: "http://211.237.50.150:7080/openapi/%s/%s/%s/%d/%d"
    start-index: 1
    end-index: 1000
    api-key: ${INGREDIENT_API_KEY}

fcm:
  enabled: false
  credentials-path: classpath:firebase/service-account-key.json

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    filter: true