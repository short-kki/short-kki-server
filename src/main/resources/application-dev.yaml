spring:
  config:
    import: optional:file:env/.env.dev[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:shortkki_dev}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:604800000}

server:
  shutdown: graceful

elasticsearch:
  index:
    recipe:
      name: recipes-dev
      settings-path: search/index/recipe-index.json

oauth2:
  provider:
    google-web:
      client-id: ${GOOGLE_WEB_CLIENT_ID}
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me

google:
  credential:
    api-key: ${GOOGLE_GENAI_API_KEY}
  services:
    gemini:
      model-name: ${GEMINI_MODEL_NAME:gemini-3-flash-preview}

public-data:
  ingredient:
    enabled: false

springdoc:
  api-docs:
    enabled: false

deep-link:
  web-domain: ${DEEP_LINK_WEB_DOMAIN}
  ios:
    team-id: ${DEEP_LINK_IOS_TEAM_ID}
    bundle-id: ${DEEP_LINK_IOS_BUNDLE_ID}
  android:
    package-name: ${DEEP_LINK_ANDROID_PACKAGE}
    sha256-cert-fingerprints:
      - ${DEEP_LINK_ANDROID_SHA256}
  store:
    app-store-url: ${DEEP_LINK_APP_STORE_URL}
    play-store-url: ${DEEP_LINK_PLAY_STORE_URL}