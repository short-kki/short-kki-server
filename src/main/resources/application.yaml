spring:
  profiles:
    active: local

  application:
    name: short-kki
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

oauth2:
  provider:
    google-ios:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    google-android:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    kakao:
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me

aws:
  region: ${AWS_REGION:ap-northeast-2}
  service:
    s3:
      bucket: ${AWS_S3_BUCKET:shortkki-dev-storage}

file:
  cdn:
    public-base-url: https://d36jasu56jneaq.cloudfront.net/
  upload:
    public-prefix: ${FILE_PUBLIC_PREFIX:public/uploads}
    private-prefix: ${FILE_PRIVATE_PREFIX:private/uploads}
    expire-seconds: ${FILE_UPLOAD_EXPIRE_SECONDS:300}
    max-bytes: ${FILE_UPLOAD_MAX_BYTES:10485760} # 10MB

google:
  credential:
    api-key: ${GOOGLE_GENAI_API_KEY:google-api-test-key}
  services:
    youtube:
      api:
        base-url: https://www.googleapis.com/youtube/v3
    gemini:
      model-name: ${GEMINI_MODEL_NAME:gemini-3-flash-preview}