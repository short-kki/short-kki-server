spring:
  application:
    name: short-kki
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    filter: true

oauth2:
  provider:
    google-ios:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    google-android:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    kakao:
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me

aws:
  region: ${AWS_REGION:ap-northeast-2}
  service:
    s3:
      bucket: ${AWS_S3_BUCKET:shortkki-dev-storage}

file:
  cdn:
    public-base-url: https://d36jasu56jneaq.cloudfront.net/
    default-path: public/
  upload:
    public-prefix: ${FILE_PUBLIC_PREFIX:public/uploads}
    private-prefix: ${FILE_PRIVATE_PREFIX:private/uploads}
    expire-seconds: ${FILE_UPLOAD_EXPIRE_SECONDS:300}
    max-bytes: ${FILE_UPLOAD_MAX_BYTES:10485760} # 10MB

google:
  services:
    youtube:
      api:
        base-url: https://www.googleapis.com/youtube/v3

elasticsearch:
  index:
    recipe:
      name: recipes
      settings-path: search/index/recipe-index.json

public-data:
  ingredient:
    enabled: false