spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: none

jwt:
  secret: test__only__short-kki__jwt-secret__32chars_min
  access-token-validity: 3600000
  refresh-token-validity: 604800000

oauth2:
  provider:
    google-web:
      client-id: test-google-client-id
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me

google:
  credential:
    api-key: google-api-test-key
  services:
    gemini:
      model-name: gemini-3-flash-preview

deep-link:
  web-domain: https://shortkki-test.com
  ios:
    team-id: XXXXXXXXXX
    bundle-id: com.test.short-kki-client
  android:
    package-name: test.shortkki.app
    sha256-cert-fingerprints:
      - XX:XX:XX:XX:XX:XX:XX:XX:XX
  store:
    app-store-url: https://apps.apple.com/app/shortkki/id000000000
    play-store-url: https://play.google.com/store/apps/details?id=com.shortkki.test